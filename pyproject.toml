[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blindoracle-sdk"
version = "0.6.0"
description = "Chainlink-verified prediction markets for autonomous agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Craig Brown", email = "craigmbrown@gmail.com"}
]
keywords = [
    "prediction-markets", "chainlink", "ai-agents", "defi", "blockchain",
    "autonomous-agents", "oracle", "x402", "fedimint"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.10"
dependencies = []  # Zero external deps — stdlib only

[project.optional-dependencies]
privacy = ["cryptography>=42"]
langchain = ["langchain>=0.1.0", "langchain-core>=0.1.0"]
autogen = ["pyautogen>=0.2.0"]
crewai = ["crewai>=0.1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
blindoracle = "blindoracle_sdk.cli:main"

[project.urls]
Homepage = "https://craigmbrown.com/blindoracle"
Documentation = "https://craigmbrown.com/blindoracle/api-guide.html"
Repository = "https://github.com/craigmbrown/blindoracle-sdk"
"Docs Repository" = "https://github.com/craigmbrown/blindoracle-docs"
"Bug Tracker" = "https://github.com/craigmbrown/blindoracle-sdk/issues"

[tool.setuptools.packages.find]
include = ["blindoracle_sdk*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
strict = true
